    <style>
        html {
            scroll-behavior: smooth;
            scroll-padding-top: calc(
                5.5rem + env(safe-area-inset-top, 0px)
            );
        }
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        section {
            scroll-margin-top: calc(
                5.5rem + env(safe-area-inset-top, 0px)
            );
        }
        #navbar {
            padding-top: env(safe-area-inset-top, 0px);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
        }
        #main-content {
            padding-bottom: calc(
                6.5rem + env(safe-area-inset-bottom, 0px)
            );
        }
        @media (min-width: 640px) {
            #main-content {
                padding-bottom: calc(
                    7.5rem + env(safe-area-inset-bottom, 0px)
                );
            }
        }
        .site-footer {
            padding-bottom: max(
                0.75rem,
                env(safe-area-inset-bottom, 0px)
            );
            padding-left: max(
                1rem,
                env(safe-area-inset-left, 0px)
            );
            padding-right: max(
                1rem,
                env(safe-area-inset-right, 0px)
            );
        }
        .nav-touch-target {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 2.75rem;
            min-height: 2.75rem;
        }
        .profile-highlight-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.25rem;
            align-items: start;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgb(226 232 240);
        }
        .dark .profile-highlight-row {
            border-bottom-color: rgb(30 41 59);
        }
        .profile-highlight-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .profile-highlight-value {
            font-weight: 600;
            word-break: break-word;
        }
        @media (min-width: 640px) {
            .profile-highlight-row {
                grid-template-columns: 1fr auto;
                gap: 1rem;
            }
            .profile-highlight-value {
                text-align: right;
            }
        }
        /*
         * Safe viewport handling on modern mobile browsers.
         */
        .hero-height {
            min-height: calc(100svh - 5rem);
        }
        /*
         * =====================================================
         * CANVAS
         * =====================================================
         */
        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100%;
            max-width: 100%;
            height: 100svh;
            height: 100dvh;
            background: transparent;
            pointer-events: none;
            z-index: 20;
            touch-action: none;
            overflow: hidden;
        }
        #canvas-container canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: transparent;
        }
        /*
         * =====================================================
         * GLASS EFFECT
         * =====================================================
         *
         * Solid fallback first, blur enhancement second.
         * This prevents poor performance on browsers/devices
         * where backdrop-filter is expensive or unavailable.
         */
        .glass-card {
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(229, 231, 235, 0.8);
        }
        .dark .glass-card {
            background: rgba(15, 23, 42, 0.94);
            border: 1px solid rgba(51, 65, 85, 0.6);
        }
        @supports (backdrop-filter: blur(12px)) {
            .glass-card {
                background: rgba(255, 255, 255, 0.75);
                backdrop-filter: blur(12px);
            }
            .dark .glass-card {
                background: rgba(15, 23, 42, 0.75);
                backdrop-filter: blur(12px);
            }
        }
        .glass-nav {
            background: rgba(255, 255, 255, 0.94);
        }
        .dark .glass-nav {
            background: rgba(15, 23, 42, 0.94);
        }
        @supports (backdrop-filter: blur(16px)) {
            .glass-nav {
                background: rgba(255, 255, 255, 0.85);
                backdrop-filter: blur(16px);
            }
            .dark .glass-nav {
                background: rgba(15, 23, 42, 0.85);
            }
        }
        /*
         * =====================================================
         * ACCESSIBILITY
         * =====================================================
         */
        :focus-visible {
            outline: 3px solid #38bdf8;
            outline-offset: 3px;
        }
        /*
         * =====================================================
         * REDUCED MOTION
         * =====================================================
         */
        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto !important;
            }
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
        /*
         * =====================================================
         * SMALL MOBILE DEVICES
         * =====================================================
         */
        @media (max-width: 480px) {
            .glass-card {
                border-radius: 1rem;
            }
            /*
             * Reduce expensive blur on very small screens.
             */
            .glass-card,
            .glass-nav {
                backdrop-filter: none;
            }
        }
        /*
         * =====================================================
         * PRINT
         * =====================================================
         */
        @media print {
            html {
                scroll-behavior: auto !important;
            }
            #canvas-container,
            .no-print,
            nav,
            footer {
                display: none !important;
            }
            body {
                background: white !important;
                color: black !important;
            }
            main {
                padding-top: 0 !important;
                padding-bottom: 0 !important;
                max-width: none !important;
            }
            .glass-card {
                background: white !important;
                border: 1px solid #ccc !important;
                box-shadow: none !important;
                backdrop-filter: none !important;
            }
            section {
                break-inside: avoid;
                page-break-inside: avoid;
            }
        }
    </style>
    <!-- =========================================================
         THEME INITIALIZATION

         Runs before body rendering to reduce theme flashing.
         ========================================================= -->
    <script>
        (() => {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark =
                window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (
                savedTheme === 'dark' ||
                (!savedTheme && prefersDark)
            ) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
</head>
<body

    <!-- =========================================================
         APPLICATION JAVASCRIPT
         ========================================================= -->
    <script>
        'use strict';
        /* =====================================================
           GLOBAL CONFIGURATION
           ===================================================== */
        const root = document.documentElement;
        const prefersReducedMotion =
            window.matchMedia &&
            window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const mobileQuery =
            window.matchMedia('(max-width: 767px)');
        const smallMobileQuery =
            window.matchMedia('(max-width: 480px)');
        /* =====================================================
           THEME
           ===================================================== */
        const themeToggleBtn =
            document.getElementById('theme-toggle');
        themeToggleBtn.addEventListener('click', () => {
            const dark =
                root.classList.toggle('dark');
            localStorage.setItem(
                'theme',
                dark ? 'dark' : 'light'
            );
            updateThemeColor();
        });
        function updateThemeColor() {
            const metaTheme =
                document.querySelector(
                    'meta[name="theme-color"]'
                );
            if (!metaTheme) return;
            metaTheme.setAttribute(
                'content',
                root.classList.contains('dark')
                    ? '#020617'
                    : '#f8fafc'
            );
        }
        updateThemeColor();
        /* =====================================================
           MOBILE NAVIGATION
           ===================================================== */
        const mobileMenuBtn =
            document.getElementById('mobile-menu-btn');
        const mobileMenu =
            document.getElementById('mobile-menu');
        const mobileMenuIcon =
            document.getElementById('mobile-menu-icon');
        function closeMobileMenu() {
            mobileMenu.classList.add('hidden');
            mobileMenuBtn.setAttribute(
                'aria-expanded',
                'false'
            );
            mobileMenuBtn.setAttribute(
                'aria-label',
                'Open navigation menu'
            );
            mobileMenuIcon.className =
                'fa-solid fa-bars text-lg';
        }
        function openMobileMenu() {
            mobileMenu.classList.remove('hidden');
            mobileMenuBtn.setAttribute(
                'aria-expanded',
                'true'
            );
            mobileMenuBtn.setAttribute(
                'aria-label',
                'Close navigation menu'
            );
            mobileMenuIcon.className =
                'fa-solid fa-xmark text-lg';
        }
        mobileMenuBtn.addEventListener('click', () => {
            const isOpen =
                mobileMenuBtn.getAttribute('aria-expanded') === 'true';
            if (isOpen) {
                closeMobileMenu();
            } else {
                openMobileMenu();
            }
        });
        document
            .querySelectorAll('.mobile-nav-link')
            .forEach(link => {
                link.addEventListener('click', () => {
                    closeMobileMenu();
                });
            });
        /*
         * Close mobile navigation when clicking outside it.
         */
        document.addEventListener('click', event => {
            if (
                window.innerWidth >= 1024 ||
                mobileMenu.classList.contains('hidden')
            ) {
                return;
            }
            const clickedInside =
                mobileMenu.contains(event.target) ||
                mobileMenuBtn.contains(event.target);
            if (!clickedInside) {
                closeMobileMenu();
            }
        });
        /*
         * Close mobile navigation with Escape.
         */
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                closeMobileMenu();
            }
        });
        /*
         * Close menu when returning to desktop.
         */
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 1024) {
                closeMobileMenu();
            }
        });
        /* =====================================================
           NAVIGATION
           ===================================================== */
        /*
         * Native anchors + CSS scroll-padding handle navigation.
         * No custom scroll calculation is necessary.
         */
        document
            .querySelectorAll('a[href^="#"]')
            .forEach(link => {
                link.addEventListener('click', event => {
                    const targetId =
                        link.getAttribute('href');
                    if (
                        !targetId ||
                        targetId === '#'
                    ) {
                        return;
                    }
                    const target =
                        document.querySelector(targetId);
                    if (!target) {
                        return;
                    }
                    /*
                     * Let the browser perform the normal
                     * anchor behavior.
                     */
                });
            });
        /* =====================================================
           DUCK / DONUT CONFIGURATION
           ===================================================== */
        const DONUT_COLORS = [
            '#FF69B4',
            '#8B4513',
            '#3186FF',
            '#0EBC5F',
            '#9D50BB',
            '#FF9800',
            '#FF4C45',
            '#00E5FF'
        ];
        const DUCK_SIZE = 54;
        const DONUT_SIZE = 32;
        const FLOOR_MARGIN = 28;

		// Capture the initial viewport height.
		// This becomes the permanent "floor" reference.
		const staticFloorHeight = window.innerHeight;
		// Static floor position.
		// It does NOT change when the mobile browser address bar moves.
		const STATIC_FLOOR_Y = staticFloorHeight - FLOOR_MARGIN;
		// Static floor position.
        /*
         * Adaptive performance configuration.
         */
        function getPerformanceConfig() {
            if (smallMobileQuery.matches) {
                return {
                    maxDonuts: 35,
                    maxDust: 20,
                    dpr: 1,
                    duckSpeed: 4.0,
                    roamMin: 0.5,
                    roamMax: 1.0
                };
            }
            if (mobileQuery.matches) {
                return {
                    maxDonuts: 60,
                    maxDust: 35,
                    dpr: 1,
                    duckSpeed: 5.0,
                    roamMin: 0.6,
                    roamMax: 1.2
                };
            }
            return {
                maxDonuts: 158,
                maxDust: 80,
                dpr: Math.min(
                    window.devicePixelRatio || 1,
                    2
                ),
                duckSpeed: 6.4,
                roamMin: 0.7,
                roamMax: 2.2
            };
        }
        let performanceConfig =
            getPerformanceConfig();
        /* =====================================================
           DUST
           ===================================================== */
        const DUST_COLORS = [
            '#C8B89A',
            '#B8A98F',
            '#D8CBB5',
            '#AFA18A',
            '#E0D5C2'
        ];
        let dustParticles = [];
        /* =====================================================
           DUCK STATE
           ===================================================== */
        const countElement =
            document.getElementById('artifact-count');
        let eatenCount = 0;
        let canvas = null;
        let ctx = null;
        let donuts = [];
        let chomp = 0;
        let animationFrame = null;
        let pageVisible =
            document.visibilityState === 'visible';
        let canvasInitialized = false;
        const duck = {
            x: 0,
            y: 0,
            facing: 1,
            roamTimer: 40,
            roamSpeed: 1.2,
            walk: 0,
            chasing: false,
            dustTimer: 0
        };
        /* =====================================================
           HELPERS
           ===================================================== */
        function isDarkTheme() {
            return root.classList.contains('dark');
        }
        function floorY(height, size) {
            return (
                height -
                FLOOR_MARGIN -
                size / 2
            );
        }
        /* =====================================================
           DUST PARTICLES
           ===================================================== */
        function createDustParticle() {
            if (
                dustParticles.length >=
                performanceConfig.maxDust
            ) {
                dustParticles.shift();
            }
            const behindX =
                duck.x -
                duck.facing *
                (DUCK_SIZE * 0.28);
            const ground = STATIC_FLOOR_Y;
            dustParticles.push({
                x:
                    behindX +
                    (Math.random() - 0.5) * 12,
                y:
                    ground -
                    Math.random() * 4,
                vx:
                    -duck.facing *
                    (
                        0.25 +
                        Math.random() * 0.7
                    ),
                vy:
                    -(
                        0.25 +
                        Math.random() * 0.65
                    ),
                size:
                    2 +
                    Math.random() * 4,
                life: 1,
                decay:
                    0.025 +
                    Math.random() * 0.035,
                color:
                    DUST_COLORS[
                        Math.floor(
                            Math.random() *
                            DUST_COLORS.length
                        )
                    ]
            });
        }
        function updateDust() {
            for (
                let i = dustParticles.length - 1;
                i >= 0;
                i--
            ) {
                const p =
                    dustParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                /*
                 * Slight upward drift.
                 */
                p.vy -= 0.022;
                p.life -= p.decay;
                if (p.life <= 0) {
                    dustParticles.splice(i, 1);
                }
            }
        }
        function drawDust() {
            if (!dustParticles.length) {
                return;
            }
            ctx.save();
            for (const p of dustParticles) {
                ctx.globalAlpha =
                    Math.max(0, p.life) *
                    0.75;
                ctx.fillStyle =
                    p.color;
                const size =
                    Math.max(
                        5,
                        Math.round(
                            p.size *
                            p.life
                        )
                    );
                ctx.fillRect(
                    Math.round(p.x),
                    Math.round(p.y),
                    size,
                    size
                );
            }
            ctx.restore();
        }

                createDustParticle();
                if (
                    Math.random() < 0.45 &&
                    performanceConfig.maxDust > 20

                    createDustParticle();

                    2 +

        /* =====================================================
           AUDIO
           ===================================================== */
        let audioCtx = null;
        let lastChompTime = 0;
        function playChomp() {
            /*
             * Do not create audio when the user has
             * explicitly requested reduced motion.
             */
            if (prefersReducedMotion) {
                return;
            }
            /*
             * Prevent rapid-fire audio spam.
             */
            const currentTime =
                performance.now();
            if (
                currentTime -
                lastChompTime <
                120
            ) {
                return;
            }
            lastChompTime =
                currentTime;
            try {
                if (!audioCtx) {
                    const AudioContext =
                        window.AudioContext ||
                        window.webkitAudioContext;
                    if (!AudioContext) {
                        return;
                    }
                    audioCtx =
                        new AudioContext();
                }
                if (
                    audioCtx.state ===
                    'suspended'
                ) {
                    audioCtx.resume();
                }
                const now =
                    audioCtx.currentTime;
                function duckChirp(
                    start,
                    freq
                ) {
                    const osc =
                        audioCtx.createOscillator();
                    const gain =
                        audioCtx.createGain();
                    osc.type =
                        'sawtooth';
                    osc.frequency.setValueAtTime(
                        freq,
                        start
                    );
                    osc.frequency.exponentialRampToValueAtTime(
                        freq * 0.65,
                        start + 0.07
                    );
                    gain.gain.setValueAtTime(
                        0.035,
                        start
                    );
                    gain.gain.exponentialRampToValueAtTime(
                        0.001,
                        start + 0.08
                    );
                    osc.connect(gain);
                    gain.connect(
                        audioCtx.destination
                    );
                    osc.start(start);
                    osc.stop(
                        start + 0.08
                    );
                }
                duckChirp(now, 500);
                duckChirp(now + 0.09, 600);
            } catch (error) {
                /*
                 * Audio is optional enhancement.
                 * Never allow it to break the animation.
                 */
                audioCtx = null;
            }

        /* =====================================================
           DROP DONUTS
           ===================================================== */
        function dropDonuts() {
            /*
             * Reduced-motion users still get the interaction
             * but without creating a large animation workload.
             */
            const maxDonuts =
                performanceConfig.maxDonuts;
            const room =
                maxDonuts -
                donuts.length;
            if (room <= 0) {
                return;
            }
            const maximumNewDonuts =
                smallMobileQuery.matches
                    ? 3
                    : mobileQuery.matches
                        ? 5
                        : 8;
            const count =
                Math.min(
                    room,
                    Math.floor(
                        Math.random() *
                        maximumNewDonuts
                    ) + 1
                );
            const w =
                window.innerWidth;
            for (
                let i = 0;
                i < count;
                i++
            ) {
                donuts.push({
                    x:
                        36 +
                        Math.random() *
                        Math.max(
                            40,
                            w - 72
                        ),
                    y:
                        -DONUT_SIZE -
                        Math.random() * 220 -
                        i * 28,
                    vx:
                        (
                            Math.random() -
                            0.5
                        ) * 2.2,
                    vy:
                        0.4 +
                        Math.random() * 1.2,
                    angle:
                        Math.random() *
                        Math.PI *
                        2,
                    spin:
                        (
                            Math.random() -
                            0.5
                        ) * 0.14,
                    frosting:
                        DONUT_COLORS[
                            (
                                i +
                                donuts.length
                            ) %
                            DONUT_COLORS.length
                        ],
                    eaten: 0
                });
            }
            /*
             * Wake animation if necessary.
             */
            ensureAnimationRunning();
        }
        /* =====================================================
           PICK DONUT PREY
           ===================================================== */
        function pickPrey() {
            const live =
                donuts.filter(
                    d => !d.eaten
                );
            if (!live.length) {
                return null;
            }
            let lowest =
                live[0];
            for (const d of live) {
                if (
                    d.y >
                    lowest.y
                ) {
                    lowest = d;
                }
            }
            let best =
                lowest;
            let bestDx =
                Math.abs(
                    lowest.x -
                    duck.x
                );
            for (const d of live) {
                if (
                    lowest.y -
                    d.y >
                    90
                ) {
                    continue;
                }
                const dx =
                    Math.abs(
                        d.x -
                        duck.x
                    );
                if (
                    dx <
                    bestDx
                ) {
                    bestDx = dx;
                    best = d;
                }
            }
            return best;
        }
        /* =====================================================
           UPDATE DUCK
           ===================================================== */
        function updateDuck(
            w,
            h
        ) {
            const y =
                floorY(
                    h,
                    DUCK_SIZE
                );
            const prey =
                pickPrey();
            const margin =
                DUCK_SIZE / 2 +
                8;
            duck.chasing =
                false;
            if (prey) {
                const dx =
                    prey.x -
                    duck.x;
                const speed =
                    performanceConfig.duckSpeed;
                if (
                    Math.abs(dx) >
                    3
                ) {
                    duck.chasing =
                        true;
                    duck.facing =
                        dx > 0
                            ? 1
                            : -1;
                    duck.x +=
                        duck.facing *
                        Math.min(
                            speed,
                            Math.abs(dx)
                        );
                    duck.walk +=
                        0.35;
                }
            } else {
                duck.roamTimer--;
                if (
                    duck.roamTimer <=
                    0
                ) {
                    duck.facing =
                        Math.random() <
                        0.5
                            ? -1
                            : 1;
                    duck.roamSpeed =
                        performanceConfig.roamMin +
                        Math.random() *
                        (
                            performanceConfig.roamMax -
                            performanceConfig.roamMin
                        );
                    duck.roamTimer =
                        80 +
                        Math.random() *
                        160;
                }
                duck.x +=
                    duck.facing *
                    duck.roamSpeed;
                duck.walk +=
                    0.12;
            }
            if (
                duck.x <
                margin
            ) {
                duck.x =
                    margin;
                duck.facing =
                    1;
                duck.roamTimer =
                    40;
            } else if (
                duck.x >
                w - margin
            ) {
                duck.x =
                    w - margin;
                duck.facing =
                    -1;
                duck.roamTimer =
                    40;
            }
            duck.y =
                y +
                Math.sin(
                    duck.walk * 2
                ) * 2;
            emitChaseDust();
        }
        /* =====================================================
           UPDATE DONUTS
           ===================================================== */
        function updateDonuts(
            w,
            h
        ) {
            const ground = STATIC_FLOOR_Y;
            const duckReachY =
                floorY(
                    h,
                    DUCK_SIZE
                );
            for (
                let i = donuts.length - 1;
                i >= 0;
                i--
            ) {
                const d =
                    donuts[i];
                /*
                 * Eaten donut animation.
                 */
                if (d.eaten) {
                    d.eaten += 1;
                    if (
                        d.eaten >
                        10
                    ) {
                        donuts.splice(
                            i,
                            1
                        );
                    }
                    continue;
                }
                d.vy +=
                    0.28;
                d.vx *=
                    0.995;
                d.x +=
                    d.vx;
                d.y +=
                    d.vy;
                d.angle +=
                    d.spin;
                d.spin *=
                    0.99;
                /*
                 * Horizontal collision.
                 */
                if (
                    d.x <
                    DONUT_SIZE / 2
                ) {
                    d.x =
                        DONUT_SIZE / 2;
                    d.vx =
                        Math.abs(
                            d.vx
                        ) * 0.6;
                } else if (
                    d.x >
                    w -
                    DONUT_SIZE / 2
                ) {
                    d.x =
                        w -
                        DONUT_SIZE / 2;
                    d.vx =
                        -Math.abs(
                            d.vx
                        ) * 0.6;
                }
                /*
                 * Floor collision.
                 */
                if (
                    d.y >
                    ground
                ) {
                    d.y =
                        ground;
                    d.vy =
                        -d.vy * 0.32;
                    d.vx *=
                        0.82;
                    d.spin +=
                        d.vx * 0.01;
                    if (
                        Math.abs(
                            d.vy
                        ) < 1.1
                    ) {
                        d.vy = 0;
                    }
                }
                /*
                 * Duck collision.
                 */
                const nearFloor =
                    d.y >
                    duckReachY -
                    36;
                const hit =
                    Math.hypot(
                        d.x - duck.x,
                        d.y - duck.y
                    ) <
                    DUCK_SIZE * 0.42 +
                    DONUT_SIZE * 0.42;
                if (
                    nearFloor &&
                    hit
                ) {
                    d.eaten =
                        1;
                    playChomp();
                    chomp =
                        8;
                    eatenCount++;
                    countElement.textContent =
                        eatenCount +
                        (
                            eatenCount === 1
                                ? ' Item'
                                : ' Items'
                        );
                }
            }
        }

                isDarkTheme()
                    ? 'rgba(100, 100, 100, 0.45)'
                    : 'rgba(15,23,42,0.16)';
            ctx.beginPath();
            ctx.ellipse(
                x,
                y,
                rx,
                ry,
                0,
                0,
                Math.PI * 2
            );
            ctx.fill();
            ctx.restore();
        }
        /* =====================================================

		let canvasWidth = 0;
		let canvasHeight = 0;
		let canvasDpr = 1;
		let canvasPixelWidth = 0;
		let canvasPixelHeight = 0;

		function resizeCanvas() {
			if (!canvas || !ctx) {
				return;
			}
			performanceConfig =
				getPerformanceConfig();
			const rect =
				canvas.getBoundingClientRect();
			canvasWidth = Math.max(
				1,
				Math.round(rect.width)
			);
			canvasHeight = Math.max(
				1,
				Math.round(rect.height)
			);
			canvasDpr =
				performanceConfig.dpr;
			const nextPixelWidth =
				Math.round(
					canvasWidth *
					canvasDpr
				);
			const nextPixelHeight =
				Math.round(
					canvasHeight *
					canvasDpr
				);
			if (
				canvasPixelWidth !==
				nextPixelWidth ||
				canvasPixelHeight !==
				nextPixelHeight
			) {
				canvas.width =
					nextPixelWidth;
				canvas.height =
					nextPixelHeight;
				canvasPixelWidth =
					nextPixelWidth;
				canvasPixelHeight =
					nextPixelHeight;
			}
			ctx.setTransform(
				canvasDpr,
				0,
				0,
				canvasDpr,
				0,
				0
			);
			ctx.imageSmoothingEnabled =
				false;

        /* =====================================================
           RENDER
           ===================================================== */
        function render() {
            animationFrame =
                null;
            if (
                !pageVisible ||
                !canvas ||
                !ctx
            ) {
                return;
            }
            resizeCanvas();
            const w = canvasWidth;
            const h = canvasHeight;
            ctx.clearRect(
                0,
                0,
                w,
                h
            );
            /*
             * Physics.
             */
            updateDonuts(
                w,
                h
            );
            updateDuck(
                w,
                h
            );
            updateDust();
            if (
                chomp > 0
            ) {
                chomp--;
            }
            const groundLine =
                h -
                FLOOR_MARGIN +
                2;
            /* =================================================
               DONUTS
               ================================================= */
            for (
                const d of donuts
            ) {
                const scale =
                    d.eaten
                        ? Math.max(
                            0.05,
                            1 -
                            d.eaten /
                            10
                        )
                        : 1;
                drawShadow(
                    d.x,
                    groundLine,
                    DONUT_SIZE *
                        0.38 *
                        scale,
                    6 *
                        scale
                );
                ctx.save();
                ctx.translate(
                    d.x,
                    d.y
                );
                ctx.rotate(
                    d.angle *
                    0.35
                );
                ctx.scale(
                    scale,
                    scale
                );
                drawPixelDonut(
                    ctx,
                    DONUT_SIZE,
                    d.frosting
                );
                ctx.restore();
            }
            /*
             * Dust behind duck.
             */
            drawDust();
            /* =================================================
               DUCK
               ================================================= */
            const squash =
                chomp > 0
                    ? 1 +
                      Math.sin(
                          (
                              8 -
                              chomp
                          ) *
                          0.8
                      ) *
                      0.08
                    : 1;
            drawShadow(
                duck.x,
                groundLine,
                DUCK_SIZE *
                    0.42,
                7
            );
            ctx.save();
            ctx.translate(
                duck.x,
                duck.y
            );
            ctx.scale(
                duck.facing *
                    squash,
                2 -
                    squash
            );
            ctx.rotate(
                Math.sin(
                    duck.walk
                ) *
                0.06 *
                duck.facing
            );
            drawPixelDuck(
                ctx,
                DUCK_SIZE
            );
            ctx.restore();
            /*
             * Continue animation.
             */
            if (
                pageVisible &&
                !prefersReducedMotion
            ) {
                animationFrame =
                    requestAnimationFrame(
                        render
                    );
            }
        }
        /* =====================================================
           ANIMATION CONTROL
           ===================================================== */
        function ensureAnimationRunning() {
            if (
                !pageVisible ||
                prefersReducedMotion ||
                !canvasInitialized
            ) {
                return;
            }
            if (
                animationFrame === null
            ) {
                animationFrame =
                    requestAnimationFrame(
                        render
                    );
            }
        }
        function stopAnimation() {
            if (
                animationFrame !== null
            ) {
                cancelAnimationFrame(
                    animationFrame
                );
                animationFrame =
                    null;
            }

                    'visible';

                    ensureAnimationRunning();

                    stopAnimation();

        /* =====================================================
           INITIALIZE CANVAS
           ===================================================== */
        function initDuckChase() {
            const container =
                document.getElementById(
                    'canvas-container'
                );
            if (!container) {
                return;
            }
            canvas =
                document.createElement(
                    'canvas'
                );
            canvas.setAttribute(
                'aria-hidden',
                'true'
            );
            canvas.style.width =
                '100%';
            canvas.style.height =
                '100%';
            canvas.style.display =
                'block';
            ctx =
                canvas.getContext(
                    '2d',
                    {
                        alpha: true,
                        desynchronized:
                            !mobileQuery.matches
                    }
                );
            if (!ctx) {
                return;
            }
            ctx.imageSmoothingEnabled =
                false;
            container.appendChild(
                canvas
            );
            duck.x =
                window.innerWidth *
                0.35;
            duck.y =
                floorY(
                    window.innerHeight,
                    DUCK_SIZE
                );
            canvasInitialized =
                true;
            resizeCanvas();
            document
                .getElementById(
                    'duck-quack-btn'
                )
                .addEventListener(
                    'click',
                    dropDonuts
                );
            /*
             * Do not continuously animate for users
             * who prefer reduced motion.
             */
            if (
                !prefersReducedMotion
            ) {
                ensureAnimationRunning();
            } else {
                /*
                 * Render a static duck once.
                 */
                renderStaticDuck();
            }

        /* =====================================================
           STATIC REDUCED-MOTION RENDER
           ===================================================== */
        function renderStaticDuck() {
            if (!canvas || !ctx) {
                return;
            }
            resizeCanvas();
            const w = canvasWidth;
            const h = canvasHeight;
            ctx.clearRect(
                0,
                0,
                w,
                h
            );
            duck.y =
                floorY(
                    h,
                    DUCK_SIZE
                );
            drawShadow(
                duck.x,
                h - FLOOR_MARGIN + 2,
                DUCK_SIZE * 0.42,
                7
            );
            ctx.save();
            ctx.translate(
                duck.x,
                duck.y
            );
            ctx.scale(
                duck.facing,
                1
            );
            drawPixelDuck(
                ctx,
                DUCK_SIZE
            );
            ctx.restore();

                            prefersReducedMotion

                        } else {
                            ensureAnimationRunning();

                    100

        window.addEventListener(
            'resize',
            handleCanvasViewportResize,
            {
                passive: true
            }
        );
        if (window.visualViewport) {
            window.visualViewport.addEventListener(
                'resize',
                handleCanvasViewportResize,
                {
                    passive: true
                }
            );
        }
        /* =====================================================
           START
           ===================================================== */
        if (
            document.readyState ===
            'loading'
        ) {
            document.addEventListener(
                'DOMContentLoaded',
                initDuckChase,
                {
                    once: true
                }
            );
        } else {
            initDuckChase();
        }
    </script>
</body>
</html>
