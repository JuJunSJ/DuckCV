    <script>
        tailwind.config = {
            darkMode: 'class',

                extend: {

                            600: '#0284c7',

                        },

                            orange: '#ff6600',

    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">
    <style>
        html {
            scroll-behavior: smooth;
            scroll-padding-top: 6rem;
        }
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        /*
         * Fixed navbar offset.
         * The navbar is approximately 64px high,
         * so Tailwind's scroll-mt-24 gives us 96px
         * of comfortable space above each section.
         */
        section {
            scroll-margin-top: 6rem;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 20;
            touch-action: none;
        }
        .canvas-interactive {
            pointer-events: auto !important;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(229, 231, 235, 0.8);
        }
        .dark .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.6);
        }
        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
        }
        .dark .glass-nav {
            background: rgba(15, 23, 42, 0.85);
        }
        @media print {
            #canvas-container,
            .no-print {
                display: none !important;
            }
            body {
                background: white !important;
                color: black !important;
            }
            .glass-card {
                background: none !important;
                border: 1px solid #ccc !important;
                box-shadow: none !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-300">
    <!-- =========================================================
         3D PHYSICS & MASCOT BACKGROUND CANVAS
         ========================================================= -->
    <div id="canvas-container"></div>
    <!-- =========================================================

    <nav id="navbar"
         class="fixed top-0 left-0 w-full z-50 glass-nav border-b border-slate-200 dark:border-slate-800 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo / Title -->
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-amber-400 text-slate-900 flex items-center justify-center font-black text-xl shadow-md">
                        <i class="fa-solid fa-feather text-slate-900"></i>

                            Duck & Donuts

                            Feed the duck with FREE DONUTS!
                        </span>
                    </div>
                </div>
                <!-- Right-side Controls -->
                <div class="flex items-center space-x-2">
                    
                    <!-- Theme Toggle -->
                    <button id="theme-toggle"
                            class="p-2 rounded-lg text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
                            aria-label="Toggle dark mode">

    </nav>
    <!-- =========================================================
         MAIN CONTENT
         ========================================================= -->
    <main id="main-content">
        <!-- =====================================================
             HERO / OVERVIEW
             ===================================================== -->
    <div class="min-h-screen flex items-center justify-center">
		<div class="w-fit bg-white p-6 rounded-2xl">
			<div class="flex items-center gap-3">
				<span class="text-slate-500">
					Eaten Snacks
				</span>

				<span id="artifact-count"
					  class="font-bold text-amber-500 text-base">
					0 Items

				<!-- Donut Button -->

						class="px-3 py-3 text-sm font-semibold rounded-lg bg-amber-400 text-slate-900 hover:bg-amber-300 transition-transform active:scale-95 shadow-sm flex items-center gap-1.5">

</div>
        
    </main>
    <!-- =========================================================
         FIXED FOOTER
         ========================================================= -->
    
	<footer class="fixed bottom-0 left-0 right-0 z-10
    border-t border-slate-200 dark:border-slate-800
    bg-slate-100/95 dark:bg-slate-900/95
    backdrop-blur-md
    py-7 text-center text-xs
    text-slate-500 dark:text-slate-400">
		<p>Duck is hunting for donuts. It's up to you to feed it!!!</p>
	</footer>
    <!-- =========================================================
         PIXEL DUCK / DONUT SCRIPT
         ========================================================= -->
    <script>
    /* =====================================================
       THEME
       ===================================================== */
    const themeToggleBtn = document.getElementById('theme-toggle');
    themeToggleBtn.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
    });
    /* =====================================================
       NAVIGATION
       ===================================================== */
    const navbar = document.getElementById('navbar');
    document.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', function (event) {
            event.preventDefault();
            const targetId = this.getAttribute('href');
            const target = document.querySelector(targetId);
            if (!target) return;
            const navbarHeight = navbar.offsetHeight;
            const extraSpacing = 24;
            const targetPosition =
                target.getBoundingClientRect().top +
                window.scrollY -
                navbarHeight -
                extraSpacing;
            window.scrollTo({
                top: Math.max(0, targetPosition),
                behavior: 'smooth'
            });
            history.pushState(null, '', targetId);
        });
    });
    window.addEventListener('load', () => {
        if (!window.location.hash) return;
        const target = document.querySelector(window.location.hash);
        if (!target) return;
        setTimeout(() => {
            const navbarHeight = navbar.offsetHeight;
            const extraSpacing = 24;
            const targetPosition =
                target.getBoundingClientRect().top +
                window.scrollY -
                navbarHeight -
                extraSpacing;
            window.scrollTo({
                top: Math.max(0, targetPosition),
                behavior: 'instant'
            });
        }, 50);
    });
    /* =====================================================
       DUCK / DONUT CONFIGURATION
       ===================================================== */
    const DONUT_COLORS = [
        '#FF69B4',
        '#8B4513',
        '#3186FF',
        '#0EBC5F',
        '#9D50BB',
        '#FF9800',
        '#FF4C45',
        '#00E5FF'
    ];
    const DUCK_SIZE = 54;
    const DONUT_SIZE = 32;
    const FLOOR_MARGIN = 58;
    const MAX_DONUTS = 158;
    /* =====================================================
       DUST CONFIGURATION
       ===================================================== */
    const MAX_DUST = 80;
    const DUST_COLORS = [
        '#C8B89A',
        '#B8A98F',
        '#D8CBB5',
        '#AFA18A',
        '#E0D5C2'
    ];
    let dustParticles = [];
    /* =====================================================
       DUCK STATE
       ===================================================== */
    const countElement =
        document.getElementById('artifact-count');
    let eatenCount = 0;
    let canvas;
    let ctx;
    let donuts = [];
    let chomp = 0;
    const duck = {
        x: 0,
        y: 0,
        facing: 1,
        roamTimer: 40,
        roamSpeed: 1.2,
        walk: 0,
        /* True only while actively chasing a donut */
        chasing: false,
        /* Used to control how frequently dust is emitted */
        dustTimer: 0
    };
    /* =====================================================
       THEME HELPERS
       ===================================================== */
    function isDarkTheme() {
        return document.documentElement.classList.contains('dark');
    }
    function floorY(height, size) {
        return height - FLOOR_MARGIN - size / 2;
    }
    /* =====================================================
       DUST PARTICLES
       ===================================================== */
    function createDustParticle() {
        if (dustParticles.length >= MAX_DUST) {
            dustParticles.shift();
        }
        /*
         * Emit dust behind the duck rather than directly
         * underneath it.
         */
        const behindX =
            duck.x -
            duck.facing *
            (DUCK_SIZE * 0.28);
        const ground =
            duck.y +
            DUCK_SIZE * 0.38;
        dustParticles.push({
            x:
                behindX +
                (Math.random() - 0.5) * 12,
            y:
                ground -
                Math.random() * 4,
            vx:
                -duck.facing *
                (0.25 + Math.random() * 0.7),
            vy:
                -(0.25 + Math.random() * 0.65),
            size:
                2 +
                Math.random() * 4,
            life: 1,
            decay:
                0.025 +
                Math.random() * 0.035,
            color:
                DUST_COLORS[
                    Math.floor(
                        Math.random() *
                        DUST_COLORS.length
                    )
                ]
        });
    }
	
	let audioCtx = null;

	function playChomp() {
		// Create the AudioContext only once
		if (!audioCtx) {
			audioCtx = new (window.AudioContext || window.webkitAudioContext)();
		}

		// Make sure the context is running
		if (audioCtx.state === "suspended") {
			audioCtx.resume();
		}

		const now = audioCtx.currentTime;

		function duckChirp(start, freq) {
			const osc = audioCtx.createOscillator();
			const gain = audioCtx.createGain();

			osc.type = "sawtooth";

			osc.frequency.setValueAtTime(freq, start);
			osc.frequency.exponentialRampToValueAtTime(
				freq * 0.65,
				start + 0.07
			);

			gain.gain.setValueAtTime(0.035, start);
			gain.gain.exponentialRampToValueAtTime(
				0.001,
				start + 0.08
			);

			osc.connect(gain);
			gain.connect(audioCtx.destination);

			osc.start(start);
			osc.stop(start + 0.08);
		}

		// "chirp chirp"
		duckChirp(now, 500);
		duckChirp(now + 0.09, 600);
	}
	
    function updateDust() {
        for (
            let i = dustParticles.length - 1;
            i >= 0;
            i--
        ) {
            const p = dustParticles[i];
            p.x += p.vx;
            p.y += p.vy;
            /*
             * Slight upward drift and gravity-like settling.
             */
            p.vy -= 0.022;
            p.life -= p.decay;
            /*
             * Dust particles disappear naturally.
             */
            if (p.life <= 0) {
                dustParticles.splice(i, 1);
            }
        }
    }
    function drawDust() {
        if (!dustParticles.length) return;
        ctx.save();
        for (const p of dustParticles) {
            ctx.globalAlpha =
                Math.max(0, p.life) * 0.75;
            ctx.fillStyle = p.color;
            /*
             * Pixel-style square particles.
             */
            const size =
                Math.max(
                    5,
                    Math.round(p.size * p.life)
                );
            ctx.fillRect(
                Math.round(p.x),
                Math.round(p.y),
                size,
                size
            );
        }
        ctx.restore();
    }
    /*
     * Emit dust only when the duck is running/chasing.
     *
     * Walking around without prey produces ZERO dust.
     */
    function emitChaseDust() {
        if (!duck.chasing) {
            duck.dustTimer = 0;
            return;
        }
        duck.dustTimer--;
        if (duck.dustTimer <= 0) {
            /*
             * Two or three tiny particles per burst
             * makes the movement feel more energetic.
             */
            createDustParticle();
            if (Math.random() < 0.45) {
                createDustParticle();
            }
            duck.dustTimer =
                2 +
                Math.floor(Math.random() * 3);
        }
    }
    /* =====================================================
       DRAW PIXEL DUCK
       ===================================================== */
    function drawPixelDuck(ctx, size) {
        const p = size / 16;
        ctx.save();
        ctx.translate(
            -size / 2,
            -size / 2
        );
        ctx.fillStyle = '#FFD13B';
        ctx.fillRect(
            3 * p,
            2 * p,
            8 * p,
            7 * p
        );
        ctx.fillRect(
            2 * p,
            6 * p,
            12 * p,
            7 * p
        );
        ctx.fillRect(
            3 * p,
            13 * p,
            9 * p,
            2 * p
        );
        ctx.fillStyle = '#F4A200';
        ctx.fillRect(
            4 * p,
            8 * p,
            5 * p,
            4 * p
        );
        ctx.fillRect(
            3 * p,
            9 * p,
            6 * p,
            2 * p
        );
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(
            8 * p,
            3 * p,
            3 * p,
            3 * p
        );
        ctx.fillStyle = '#111111';
        ctx.fillRect(
            9 * p,
            4 * p,
            2 * p,
            2 * p
        );
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(
            9 * p,
            4 * p,
            1 * p,
            1 * p
        );
        ctx.fillStyle = '#FF6D00';
        ctx.fillRect(
            11 * p,
            5 * p,
            5 * p,
            3 * p
        );
        ctx.fillRect(
            11 * p,
            7 * p,
            4 * p,
            1 * p
        );
        ctx.fillStyle = '#FF8A80';
        ctx.fillRect(
            7 * p,
            6 * p,
            2 * p,
            1 * p
        );
        ctx.fillStyle = '#FFD13B';
        ctx.fillRect(
            1 * p,
            7 * p,
            2 * p,
            3 * p
        );
        ctx.fillStyle =
            'rgba(0, 0, 0, 0.15)';
        ctx.fillRect(
            2 * p,
            14 * p,
            10 * p,
            1 * p
        );
        ctx.restore();
    }
    /* =====================================================
       DRAW PIXEL DONUT
       ===================================================== */
    function drawPixelDonut(
        ctx,
        size,
        frostingColor
    ) {
        const p = size / 14;
        ctx.save();
        ctx.translate(
            -size / 2,
            -size / 2
        );
        ctx.fillStyle = '#D99B56';
        ctx.fillRect(
            3 * p,
            1 * p,
            8 * p,
            12 * p
        );
        ctx.fillRect(
            1 * p,
            3 * p,
            12 * p,
            8 * p
        );
        ctx.fillRect(
            2 * p,
            2 * p,
            10 * p,
            10 * p
        );
        ctx.fillStyle =
            frostingColor || '#FF69B4';
        ctx.fillRect(
            3 * p,
            1 * p,
            8 * p,
            5 * p
        );
        ctx.fillRect(
            2 * p,
            2 * p,
            10 * p,
            6 * p
        );
        ctx.fillRect(
            1 * p,
            3 * p,
            12 * p,
            4 * p
        );
        ctx.fillRect(
            2 * p,
            8 * p,
            2 * p,
            2 * p
        );
        ctx.fillRect(
            6 * p,
            8 * p,
            2 * p,
            1 * p
        );
        ctx.fillRect(
            10 * p,
            8 * p,
            2 * p,
            3 * p
        );
        ctx.fillStyle = '#C0823F';
        ctx.fillRect(
            5 * p,
            4 * p,
            4 * p,
            1 * p
        );
        ctx.fillRect(
            4 * p,
            5 * p,
            1 * p,
            4 * p
        );
        ctx.globalCompositeOperation =
            'destination-out';
        ctx.fillStyle = '#000';
        ctx.fillRect(
            5 * p,
            5 * p,
            4 * p,
            4 * p
        );
        ctx.globalCompositeOperation =
            'source-over';
        const sprinkles = [
            { x: 3, y: 2, c: '#FFFFFF' },
            { x: 7, y: 2, c: '#00E5FF' },
            { x: 10, y: 3, c: '#FFEA00' },
            { x: 3, y: 5, c: '#76FF03' },
            { x: 9, y: 5, c: '#FFFFFF' },
            { x: 6, y: 3, c: '#FF4081' }
        ];
        sprinkles.forEach((s) => {
            ctx.fillStyle = s.c;
            ctx.fillRect(
                s.x * p,
                s.y * p,
                1.5 * p,
                1.5 * p
            );
        });
        ctx.restore();
    }
    /* =====================================================
       DROP DONUTS
       ===================================================== */
    function dropDonuts() {
        const w = window.innerWidth;
        const room =
            MAX_DONUTS -
            donuts.length;
        const count =
            Math.floor(Math.random() * 8) + 1
        for (let i = 0; i < count; i++) {
            donuts.push({
                x:
                    36 +
                    Math.random() *
                    Math.max(40, w - 72),
                y:
                    -DONUT_SIZE -
                    Math.random() * 220 -
                    i * 28,
                vx:
                    (Math.random() - 0.5) * 2.2,
                vy:
                    0.4 +
                    Math.random() * 1.2,
                angle:
                    Math.random() *
                    Math.PI *
                    2,
                spin:
                    (Math.random() - 0.5) * 0.14,
                frosting:
                    DONUT_COLORS[
                        (i + donuts.length) %
                        DONUT_COLORS.length
                    ],
                eaten: 0
            });
        }
    }
    /* =====================================================
       PICK DONUT PREY
       ===================================================== */
    function pickPrey() {
        const live =
            donuts.filter(
                (d) => !d.eaten
            );
        if (!live.length) {
            return null;
        }
        let lowest = live[0];
        for (const d of live) {
            if (d.y > lowest.y) {
                lowest = d;
            }
        }
        let best = lowest;
        let bestDx =
            Math.abs(
                lowest.x -
                duck.x
            );
        for (const d of live) {
            if (
                lowest.y -
                d.y >
                90
            ) {
                continue;
            }
            const dx =
                Math.abs(
                    d.x -
                    duck.x
                );
            if (dx < bestDx) {
                bestDx = dx;
                best = d;
            }
        }
        return best;
    }
    /* =====================================================
       UPDATE DUCK
       ===================================================== */
    function updateDuck(w, h) {
        const y =
            floorY(
                h,
                DUCK_SIZE
            );
        const prey =
            pickPrey();
        const margin =
            DUCK_SIZE / 2 + 8;
        /*
         * Reset chasing state every frame.
         * It becomes true only if the duck has a donut
         * target AND is actually moving toward it.
         */
        duck.chasing = false;
        if (prey) {
            const dx =
                prey.x -
                duck.x;
            const speed = 6.4;
            if (Math.abs(dx) > 3) {
                duck.chasing = true;
                duck.facing =
                    dx > 0
                        ? 1
                        : -1;
                duck.x +=
                    duck.facing *
                    Math.min(
                        speed,
                        Math.abs(dx)
                    );
                /*
                 * Faster leg animation while running.
                 */
                duck.walk += 0.35;
            }
        } else {
            duck.roamTimer--;
            if (
                duck.roamTimer <= 0
            ) {
                duck.facing =
                    Math.random() < 0.5
                        ? -1
                        : 1;
                duck.roamSpeed =
                    0.7 +
                    Math.random() * 1.5;
                duck.roamTimer =
                    80 +
                    Math.random() * 160;
            }
            /*
             * Normal walking.
             * No dust is emitted here.
             */
            duck.x +=
                duck.facing *
                duck.roamSpeed;
            duck.walk += 0.12;
        }
        if (duck.x < margin) {
            duck.x = margin;
            duck.facing = 1;
            duck.roamTimer = 40;
        } else if (
            duck.x >
            w - margin
        ) {
            duck.x =
                w - margin;
            duck.facing = -1;
            duck.roamTimer = 40;
        }
        duck.y =
            y +
            Math.sin(
                duck.walk * 2
            ) * 2;
        /*
         * Dust is generated AFTER the movement state
         * has been calculated.
         */
        emitChaseDust();
    }
    /* =====================================================
       UPDATE DONUTS
       ===================================================== */
    function updateDonuts(w, h) {
        const ground =
            floorY(
                h,
                DONUT_SIZE
            ) + 6;
        const duckReachY =
            floorY(
                h,
                DUCK_SIZE
            );
        for (
            let i = donuts.length - 1;
            i >= 0;
            i--
        ) {
            const d = donuts[i];
            if (d.eaten) {
                d.eaten += 1;
                if (d.eaten > 10) {
                    donuts.splice(i, 1);
                }
                continue;
            }
            d.vy += 0.28;
            d.vx *= 0.995;
            d.x += d.vx;
            d.y += d.vy;
            d.angle += d.spin;
            d.spin *= 0.99;
            if (
                d.x <
                DONUT_SIZE / 2
            ) {
                d.x =
                    DONUT_SIZE / 2;
                d.vx =
                    Math.abs(d.vx) *
                    0.6;
            } else if (
                d.x >
                w -
                DONUT_SIZE / 2
            ) {
                d.x =
                    w -
                    DONUT_SIZE / 2;
                d.vx =
                    -Math.abs(d.vx) *
                    0.6;
            }
            if (d.y > ground) {
                d.y = ground;
                d.vy =
                    -d.vy * 0.32;
                d.vx *= 0.82;
                d.spin +=
                    d.vx * 0.01;
                if (
                    Math.abs(d.vy) <
                    1.1
                ) {
                    d.vy = 0;
                }
            }
            const nearFloor =
                d.y >
                duckReachY - 36;
            const hit =
                Math.hypot(
                    d.x - duck.x,
                    d.y - duck.y
                ) <
                DUCK_SIZE * 0.42 +
                DONUT_SIZE * 0.42;
            if (
                nearFloor &&
                hit
            ) {
                d.eaten = 1;
				playChomp();
                chomp = 8;
                eatenCount++;
                countElement.innerText =
                    eatenCount +
                    (
                        eatenCount === 1
                            ? ' Item'
                            : ' Items'
                    );
            }
        }
    }
    /* =====================================================
       DRAW SHADOW
       ===================================================== */
    function drawShadow(
        x,
        y,
        rx,
        ry
    ) {
        ctx.save();
        ctx.fillStyle =
            isDarkTheme()
                ? '#757272'
                : 'rgba(15,23,42,0.16)';
        ctx.beginPath();
        ctx.ellipse(
            x,
            y,
            rx,
            ry,
            0,
            0,
            Math.PI * 2
        );
        ctx.fill();
        ctx.restore();
    }
    /* =====================================================
       RENDER LOOP
       ===================================================== */
    function render() {
        const dpr =
            Math.min(
                window.devicePixelRatio || 1,
                2
            );
        const w =
            window.innerWidth;
        const h =
            window.innerHeight;
        if (
            canvas.width !==
            Math.floor(w * dpr) ||
            canvas.height !==
            Math.floor(h * dpr)
        ) {
            canvas.width =
                Math.floor(w * dpr);
            canvas.height =
                Math.floor(h * dpr);
        }
        ctx.setTransform(
            dpr,
            0,
            0,
            dpr,
            0,
            0
        );
        ctx.clearRect(
            0,
            0,
            w,
            h
        );
        updateDonuts(w, h);
        updateDuck(w, h);
        /*
         * Update dust after duck movement.
         */
        updateDust();
        if (chomp > 0) {
            chomp--;
        }
        const groundLine =
            h -
            FLOOR_MARGIN +
            2;
        /* =================================================
           DONUTS
           ================================================= */
        for (const d of donuts) {
            const scale =
                d.eaten
                    ? Math.max(
                        0.05,
                        1 -
                        d.eaten / 10
                    )
                    : 1;
            drawShadow(
                d.x,
                groundLine,
                DONUT_SIZE *
                    0.38 *
                    scale,
                6 * scale
            );
            ctx.save();
            ctx.translate(
                d.x,
                d.y
            );
            ctx.rotate(
                d.angle * 0.35
            );
            ctx.scale(
                scale,
                scale
            );
            drawPixelDonut(
                ctx,
                DONUT_SIZE,
                d.frosting
            );
            ctx.restore();
        }
        /*
         * Draw dust BEFORE the duck so the duck appears
         * in front of its own dust cloud.
         */
        drawDust();
        /* =================================================
           DUCK
           ================================================= */
        const squash =
            chomp > 0
                ? 1 +
                  Math.sin(
                      (8 - chomp) *
                      0.8
                  ) *
                  0.08
                : 1;
        drawShadow(
            duck.x,
            groundLine,
            DUCK_SIZE * 0.42,
            7
        );
        ctx.save();
        ctx.translate(
            duck.x,
            duck.y
        );
        ctx.scale(
            duck.facing * squash,
            2 - squash
        );
        ctx.rotate(
            Math.sin(
                duck.walk
            ) *
            0.06 *
            duck.facing
        );
        drawPixelDuck(
            ctx,
            DUCK_SIZE
        );
        ctx.restore();
        requestAnimationFrame(
            render
        );
    }
    /* =====================================================
       INITIALIZE DUCK
       ===================================================== */
    function initDuckChase() {
        const container =
            document.getElementById(
                'canvas-container'
            );
        canvas =
            document.createElement(
                'canvas'
            );
        canvas.style.width =
            '100%';
        canvas.style.height =
            '100%';
        canvas.style.display =
            'block';
        ctx =
            canvas.getContext(
                '2d'
            );
        /*
         * Keep the pixel art crisp.
         */
        ctx.imageSmoothingEnabled =
            false;
        container.appendChild(
            canvas
        );
        duck.x =
            window.innerWidth *
            0.35;
        document
            .getElementById(
                'duck-quack-btn'
            )
            .addEventListener(
                'click',
                dropDonuts
            );
        render();
    }
    /* =====================================================
       START
       ===================================================== */
    window.addEventListener(
        'DOMContentLoaded',
        initDuckChase
    );
</script>
</body>
</html>
